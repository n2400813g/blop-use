[project]
name = "blop"
version = "0.2.0"
description = "AI-powered QA testing via MCP"
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=1.0.0",
  "browser-use",
  "playwright",
  "langchain_google_genai",
  "langchain_core",
  "pydantic>=2.0",
  "screeninfo",
  "aiosqlite>=0.19.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-asyncio>=0.21",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["blop*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.scripts]
blop = "blop.server:run"
blop-mcp = "blop.server:run"
