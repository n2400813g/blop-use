[project]
name = "vibeqa-mcp"
version = "0.2.0"
description = "AI-powered QA testing via MCP — discover, record, and run regression tests with Browser-Use agents"
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=1.0.0",
  "browser-use",
  "playwright",
  "langchain_google_genai",
  "langchain_core",
  "pydantic>=2.0",
  "screeninfo",
  "aiosqlite>=0.19.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-asyncio>=0.21",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["vibeqa_mcp*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.scripts]
vibeqa = "vibeqa_mcp.server:run"
vibeqa-mcp = "vibeqa_mcp.server:run"
vibetest = "vibeqa_mcp.server:run"
vibetest-mcp = "vibeqa_mcp.server:run"
